<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AirDraw — الرسم بالإيماءات</title>
<style>
  :root{
    --ink-green:#39ff8a;
    --ink-green-dim:#1f8f52;
    --bg:#050607;
    --panel:#0d1210cc;
    --panel-border:#39ff8a33;
    --text:#eafff2;
    --muted:#7fa896;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--text);}

  #stage{position:fixed;inset:0;background:#000;touch-action:none;}
  #ink, #live{position:absolute; inset:0; width:100%; height:100%;}
  #live{pointer-events:none;}

  #divider{position:absolute; top:0; bottom:0; left:50%; width:1px; background:linear-gradient(var(--ink-green-dim), var(--ink-green), var(--ink-green-dim)); box-shadow:0 0 10px var(--ink-green); display:none; z-index:5;}
  #sideTag{position:absolute; top:14px; z-index:6; display:none; font-family:var(--mono); font-size:11px; letter-spacing:.15em; color:var(--muted); padding:4px 10px; border:1px solid var(--panel-border); border-radius:20px; background:var(--panel); backdrop-filter:blur(6px);}

  /* camera bubble */
  #camWrap{
    position:absolute; top:16px; left:16px; z-index:20;
    width:78px; height:78px; border-radius:50%;
    overflow:hidden; border:1.5px solid var(--ink-green);
    box-shadow:0 0 16px #39ff8a55, inset 0 0 12px #000;
    transition: width .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1), border-radius .32s ease, top .32s ease, left .32s ease;
    cursor:pointer;
    background:#000;
  }
  #camWrap.expanded{
    width:min(70vw,320px); height:min(70vw,320px); border-radius:20px;
    top:16px; left:16px;
  }
  #camWrap video{
    width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1);
  }
  #camHint{position:absolute; bottom:2px; left:0; right:0; text-align:center; font-family:var(--mono); font-size:8px; color:var(--ink-green); opacity:.8; z-index:2;}

  #status{
    position:absolute; top:22px; right:16px; z-index:20;
    font-family:var(--mono); font-size:10px; letter-spacing:.12em;
    color:var(--muted); text-align:right; line-height:1.6;
  }
  #status b{color:var(--ink-green);}

  /* toolbar */
  #toolbar{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; align-items:center; z-index:30;
    background:var(--panel); border:1px solid var(--panel-border);
    padding:10px 14px; border-radius:30px; backdrop-filter:blur(10px);
  }
  .tbtn{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--panel-border);
    background:#0b0f0d; display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; transition:transform .15s ease, box-shadow .15s ease;
  }
  .tbtn:active{transform:scale(.9);}
  .tbtn svg{width:20px;height:20px;stroke:var(--ink-green);fill:none;stroke-width:1.6;}
  #colorDot{width:20px;height:20px;border-radius:50%;background:var(--ink-green);box-shadow:0 0 8px currentColor;}

  /* color ring popup */
  #colorRing{
    position:absolute; bottom:90px; left:50%; transform:translateX(-50%) scale(.9);
    display:none; width:230px; height:230px; z-index:31;
    opacity:0; transition:opacity .18s ease, transform .18s ease;
  }
  #colorRing.show{display:block; opacity:1; transform:translateX(-50%) scale(1);}
  .swatch{
    position:absolute; width:32px; height:32px; border-radius:50%;
    border:2px solid #00000055; cursor:pointer; box-shadow:0 2px 8px #0007;
    transition:transform .12s ease;
  }
  .swatch:active{transform:scale(1.25);}

  /* size popup */
  #sizePanel{
    position:absolute; bottom:90px; left:50%; transform:translateX(-50%);
    display:none; z-index:31; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:20px; padding:16px 20px; align-items:center; gap:12px; width:220px;
  }
  #sizePanel.show{display:flex;}
  #sizeSlider{flex:1; accent-color:var(--ink-green);}
  #sizePreviewDot{border-radius:50%; background:var(--ink-green);}

  /* collab modal */
  #collabModal{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center;
    background:#000000cc; backdrop-filter:blur(4px);
  }
  #collabModal.show{display:flex;}
  .card{
    width:min(88vw,340px); background:#0b0f0d; border:1px solid var(--panel-border);
    border-radius:18px; padding:22px; text-align:center;
  }
  .card h2{font-size:16px; margin:0 0 4px; color:var(--ink-green); font-family:var(--mono); letter-spacing:.1em;}
  .card p{font-size:12px; color:var(--muted); margin:0 0 16px; line-height:1.6;}
  .codeBox{
    font-family:var(--mono); font-size:28px; letter-spacing:.3em; color:var(--ink-green);
    background:#000; border:1px dashed var(--ink-green-dim); border-radius:10px;
    padding:14px; margin-bottom:14px;
  }
  .card input{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--panel-border);
    background:#000; color:var(--text); font-family:var(--mono); font-size:18px; text-align:center;
    letter-spacing:.25em; margin-bottom:12px;
  }
  .card button{
    width:100%; padding:12px; border-radius:10px; border:none; margin-bottom:8px;
    font-family:var(--sans); font-weight:600; font-size:14px; cursor:pointer;
  }
  .primaryBtn{background:var(--ink-green); color:#02150a;}
  .ghostBtn{background:transparent; color:var(--muted); border:1px solid var(--panel-border) !important;}
  #closeModal{position:absolute; top:14px; left:14px; color:var(--muted); font-size:22px; cursor:pointer;}

  #toast{
    position:absolute; top:80px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--panel-border); color:var(--ink-green);
    font-family:var(--mono); font-size:11px; padding:8px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:60;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<div id="stage">
  <canvas id="ink"></canvas>
  <canvas id="live"></canvas>
  <div id="divider"></div>
  <div id="sideTag"></div>
</div>

<div id="camWrap">
  <video id="cam" autoplay playsinline muted></video>
  <div id="camHint">اضغط للتكبير</div>
</div>

<div id="status">
  <div><b id="handState">—</b></div>
  <div id="roomState">لا يوجد اتصال</div>
</div>

<div id="toast"></div>

<div id="toolbar">
  <div class="tbtn" id="colorBtn" title="الألوان"><div id="colorDot"></div></div>
  <div class="tbtn" id="sizeBtn" title="سماكة القلم">
    <svg viewBox="0 0 24 24"><path d="M3 17l7-7 4 4-7 7H3v-4z"/><path d="M13 7l4-4 4 4-4 4z"/></svg>
  </div>
  <div class="tbtn" id="collabBtn" title="ادعُ صديقاً">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M4 20c0-3 2-5 5-5s5 2 5 5"/><path d="M16 5l3 3-3 3"/></svg>
  </div>
  <div class="tbtn" id="clearBtn" title="مسح">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
  </div>
</div>

<div id="colorRing"></div>

<div id="sizePanel">
  <div id="sizePreviewDot"></div>
  <input type="range" id="sizeSlider" min="2" max="42" value="6">
</div>

<div id="collabModal">
  <div class="card" style="position:relative;">
    <div id="closeModal">✕</div>
    <h2>ارسم مع صديق</h2>
    <p>أنشئ غرفة وشارك الرمز، أو أدخل رمزاً وصلك من صديقك. تنقسم الشاشة بخط رفيع، كل شخص يرسم في جهته وترون رسمة بعضكم لحظياً.</p>
    <div id="createStep">
      <button class="primaryBtn" id="createRoomBtn">إنشاء غرفة جديدة</button>
    </div>
    <div id="createdBox" style="display:none;">
      <div class="codeBox" id="roomCodeDisplay">------</div>
      <button class="ghostBtn" id="copyCodeBtn">نسخ الرمز</button>
    </div>
    <p style="margin-top:14px;">— أو —</p>
    <input type="text" id="joinInput" placeholder="أدخل الرمز" maxlength="6">
    <button class="primaryBtn" id="joinRoomBtn">انضمام</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

<script>
(function(){

/* ---------------- canvas setup ---------------- */
const inkCanvas = document.getElementById('ink');
const liveCanvas = document.getElementById('live');
const inkCtx = inkCanvas.getContext('2d');
const liveCtx = liveCanvas.getContext('2d');

function resize(){
  [inkCanvas, liveCanvas].forEach(c=>{
    const prevW = c.width, prevH = c.height;
    c.width = window.innerWidth * devicePixelRatio;
    c.height = window.innerHeight * devicePixelRatio;
  });
  inkCtx.lineCap='round'; inkCtx.lineJoin='round';
}
resize();
window.addEventListener('resize', resize);

const W = ()=>inkCanvas.width, H = ()=>inkCanvas.height;

/* ---------------- state ---------------- */
let currentColor = '#39ff8a';
let currentSize = 6;
let drawing = false;
let lastPoint = null;
let currentStrokePoints = [];
let strokeCount = 0;

let mySide = null; // 'left' | 'right' | null (solo mode)
let roomCode = null;
let remoteSeenIndex = 0;
let pollTimer = null;

/* ---------------- toast ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- geometry helpers for split mode ---------------- */
// returns {minX,maxX} pixel bounds for a given side
function sideBounds(side){
  if(!side) return {minX:0, maxX:W()};
  const half = W()/2;
  return side==='left' ? {minX:0,maxX:half} : {minX:half,maxX:W()};
}
function clampToSide(x, side){
  const b = sideBounds(side);
  return Math.min(Math.max(x, b.minX), b.maxX);
}
// normalize a point within a side's box to 0..1,0..1 (for sync across screen sizes)
function normalizeInSide(x, y, side){
  const b = sideBounds(side);
  return { nx: (x - b.minX) / (b.maxX - b.minX), ny: y / H() };
}
function denormalizeInSide(nx, ny, side){
  const b = sideBounds(side);
  return { x: b.minX + nx * (b.maxX - b.minX), y: ny * H() };
}

/* ---------------- drawing primitives ---------------- */
function strokeSegment(x1,y1,x2,y2,color,size){
  inkCtx.strokeStyle = color;
  inkCtx.lineWidth = size * devicePixelRatio;
  inkCtx.shadowColor = color;
  inkCtx.shadowBlur = size * 0.9;
  inkCtx.beginPath();
  inkCtx.moveTo(x1,y1);
  inkCtx.lineTo(x2,y2);
  inkCtx.stroke();
  inkCtx.shadowBlur = 0;
}

function updateDivider(){
  const div = document.getElementById('divider');
  const tag = document.getElementById('sideTag');
  if(mySide){
    div.style.display='block';
    tag.style.display='block';
    tag.style.left = mySide==='left' ? '10px' : 'auto';
    tag.style.right = mySide==='right' ? '10px' : 'auto';
    tag.textContent = mySide==='left' ? 'جهتك: يسار' : 'جهتك: يمين';
  } else {
    div.style.display='none';
    tag.style.display='none';
  }
}

/* ---------------- local pointer/gesture drawing ---------------- */
function beginStroke(x, y){
  drawing = true;
  lastPoint = {x,y};
  currentStrokePoints = [{x,y}];
}
function extendStroke(x, y){
  if(!drawing) return;
  const cx = mySide ? clampToSide(x, mySide) : x;
  strokeSegment(lastPoint.x, lastPoint.y, cx, y, currentColor, currentSize);
  lastPoint = {x:cx, y};
  currentStrokePoints.push({x:cx, y});
}
function endStroke(){
  if(!drawing) return;
  drawing = false;
  if(roomCode && mySide && currentStrokePoints.length>1){
    pushStrokeToRoom(currentStrokePoints, currentColor, currentSize, mySide);
  }
  currentStrokePoints = [];
  lastPoint = null;
}

/* ---------------- hand tracking ---------------- */
const videoEl = document.getElementById('cam');
const handStateEl = document.getElementById('handState');

function distPx(a,b){
  const dx=(a.x-b.x)*W(), dy=(a.y-b.y)*H();
  return Math.hypot(dx,dy);
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function onResults(results){
  liveCtx.clearRect(0,0,W(),H());

  if(!results.multiHandLandmarks || results.multiHandLandmarks.length===0){
    handStateEl.textContent = 'لا توجد يد';
    if(drawing) endStroke();
    return;
  }

  const lm = results.multiHandLandmarks[0];
  // mirror x since selfie view
  const pts = lm.map(p=>({x: 1-p.x, y: p.y}));

  // draw skeleton (neon connected dots)
  liveCtx.strokeStyle = 'rgba(57,255,138,0.55)';
  liveCtx.lineWidth = 2*devicePixelRatio;
  HAND_CONNECTIONS.forEach(([a,b])=>{
    liveCtx.beginPath();
    liveCtx.moveTo(pts[a].x*W(), pts[a].y*H());
    liveCtx.lineTo(pts[b].x*W(), pts[b].y*H());
    liveCtx.stroke();
  });
  pts.forEach((p,i)=>{
    liveCtx.beginPath();
    liveCtx.fillStyle = i===4 || i===8 ? '#eaffef' : 'rgba(57,255,138,0.85)';
    liveCtx.arc(p.x*W(), p.y*H(), (i===4||i===8?4.5:3)*devicePixelRatio, 0, Math.PI*2);
    liveCtx.fill();
  });

  // pinch detection: thumb tip(4) vs index tip(8), scaled by hand size (wrist0->middleMCP9)
  const handSize = distPx(pts[0], pts[9]) || 60;
  const pinchDist = distPx(pts[4], pts[8]);
  const isPinching = pinchDist < handSize*0.42;

  handStateEl.textContent = isPinching ? 'يرسم ✍' : 'يد ظاهرة';

  const tipX = ((pts[4].x+pts[8].x)/2) * W();
  const tipY = ((pts[4].y+pts[8].y)/2) * H();

  if(isPinching){
    if(!drawing) beginStroke(mySide?clampToSide(tipX,mySide):tipX, tipY);
    else extendStroke(tipX, tipY);
  } else {
    if(drawing) endStroke();
  }
}

let handsReady = false;
async function initHands(){
  const stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}, audio:false});
  videoEl.srcObject = stream;

  const hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
  hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.6,
    minTrackingConfidence:0.6
  });
  hands.onResults(onResults);

  const camera = new Camera(videoEl, {
    onFrame: async ()=>{ await hands.send({image:videoEl}); },
    width:640, height:480
  });
  camera.start();
  handsReady = true;
  toast('تتبع اليد يعمل — قرّب السبابة من الإبهام لترسم');
}
initHands().catch(err=>{
  toast('تعذر الوصول إلى الكاميرا');
  console.error(err);
});

/* ---------------- camera bubble expand ---------------- */
document.getElementById('camWrap').addEventListener('click', function(){
  this.classList.toggle('expanded');
});

/* ---------------- color ring ---------------- */
const PALETTE = [
  '#39ff8a','#ffffff','#ff3b6b','#ff9d2e','#ffe23b',
  '#3bd6ff','#4d6bff','#b83bff','#ff3bd6','#3bff6b',
  '#ff5c00','#00ffd0','#8affc1','#ff8ac1','#8a8aff','#c1ff8a'
];
const ringEl = document.getElementById('colorRing');
PALETTE.forEach((color,i)=>{
  const angle = (i/PALETTE.length)*Math.PI*2 - Math.PI/2;
  const r = 95;
  const x = 115 + r*Math.cos(angle) - 16;
  const y = 115 + r*Math.sin(angle) - 16;
  const sw = document.createElement('div');
  sw.className='swatch';
  sw.style.background = color;
  sw.style.left = x+'px';
  sw.style.top = y+'px';
  sw.addEventListener('click', ()=>{
    currentColor = color;
    document.getElementById('colorDot').style.background = color;
    document.getElementById('sizePreviewDot').style.background = color;
    ringEl.classList.remove('show');
  });
  ringEl.appendChild(sw);
});
document.getElementById('colorBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  document.getElementById('sizePanel').classList.remove('show');
  ringEl.classList.toggle('show');
});
document.body.addEventListener('click', ()=> ringEl.classList.remove('show'));

/* ---------------- size panel ---------------- */
const sizePanel = document.getElementById('sizePanel');
const sizeSlider = document.getElementById('sizeSlider');
function updateSizeDot(){
  const d = document.getElementById('sizePreviewDot');
  const s = Math.max(6, currentSize);
  d.style.width = s+'px'; d.style.height = s+'px';
}
updateSizeDot();
sizeSlider.addEventListener('input', ()=>{
  currentSize = parseInt(sizeSlider.value,10);
  updateSizeDot();
});
document.getElementById('sizeBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  ringEl.classList.remove('show');
  sizePanel.classList.toggle('show');
});
sizePanel.addEventListener('click', e=>e.stopPropagation());
ringEl.addEventListener('click', e=>e.stopPropagation());

/* ---------------- clear ---------------- */
document.getElementById('clearBtn').addEventListener('click', ()=>{
  inkCtx.clearRect(0,0,W(),H());
});

/* ---------------- collab modal ---------------- */
const modal = document.getElementById('collabModal');
document.getElementById('collabBtn').addEventListener('click', ()=> modal.classList.add('show'));
document.getElementById('closeModal').addEventListener('click', ()=> modal.classList.remove('show'));

function randomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function storageSet(key, value){
  try{ return await window.storage.set(key, value, true); }catch(e){ console.error(e); return null; }
}
async function storageGet(key){
  try{ return await window.storage.get(key, true); }catch(e){ return null; }
}
async function storageList(prefix){
  try{ return await window.storage.list(prefix, true); }catch(e){ return null; }
}

document.getElementById('createRoomBtn').addEventListener('click', async ()=>{
  roomCode = randomCode();
  mySide = 'left';
  document.getElementById('roomCodeDisplay').textContent = roomCode;
  document.getElementById('createStep').style.display='none';
  document.getElementById('createdBox').style.display='block';
  await storageSet(`airdraw:${roomCode}:meta`, JSON.stringify({created:Date.now()}));
  startRoom();
});

document.getElementById('copyCodeBtn').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(roomCode); toast('تم نسخ الرمز'); }
  catch(e){ toast('الرمز: '+roomCode); }
});

document.getElementById('joinRoomBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('joinInput').value.trim().toUpperCase();
  if(code.length<4){ toast('أدخل رمزاً صحيحاً'); return; }
  const meta = await storageGet(`airdraw:${code}:meta`);
  if(!meta){ toast('لم يتم العثور على الغرفة'); return; }
  roomCode = code;
  mySide = 'right';
  toast('تم الانضمام إلى الغرفة');
  modal.classList.remove('show');
  startRoom();
});

function startRoom(){
  updateDivider();
  document.getElementById('roomState').innerHTML = `متصل — الغرفة <b>${roomCode}</b>`;
  modal.classList.remove('show');
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollRemote, 700);
}

async function pushStrokeToRoom(points, color, size, side){
  const nPoints = points.map(p=>{
    const n = normalizeInSide(p.x, p.y, side);
    return [Math.round(n.nx*1000)/1000, Math.round(n.ny*1000)/1000];
  });
  const payload = JSON.stringify({color, size, pts:nPoints});
  await storageSet(`airdraw:${roomCode}:${side}:${strokeCount}`, payload);
  strokeCount++;
}

const otherSide = ()=> mySide==='left' ? 'right' : 'left';

async function pollRemote(){
  if(!roomCode || !mySide) return;
  const listRes = await storageList(`airdraw:${roomCode}:${otherSide()}:`);
  if(!listRes || !listRes.keys) return;
  const indices = listRes.keys
    .map(k=>parseInt(k.split(':').pop(),10))
    .filter(n=>!isNaN(n) && n>=remoteSeenIndex)
    .sort((a,b)=>a-b);
  for(const idx of indices){
    const res = await storageGet(`airdraw:${roomCode}:${otherSide()}:${idx}`);
    if(!res) continue;
    try{
      const data = JSON.parse(res.value);
      drawRemoteStroke(data, otherSide());
    }catch(e){}
    remoteSeenIndex = Math.max(remoteSeenIndex, idx+1);
  }
}

function drawRemoteStroke(data, side){
  const {color,size,pts} = data;
  if(!pts || pts.length<2) return;
  let prev = denormalizeInSide(pts[0][0], pts[0][1], side);
  for(let i=1;i<pts.length;i++){
    const cur = denormalizeInSide(pts[i][0], pts[i][1], side);
    strokeSegment(prev.x, prev.y, cur.x, cur.y, color, size);
    prev = cur;
  }
}

})();
</script>
</body>
</html>
